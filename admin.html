<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - PoGo Hub</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=6">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <meta name="theme-color" content="#0f172a">
    <script src="settings.js?v=6"></script>
    <script src="config.js?v=6"></script>
</head>

<body>
    <div class="background-globes">
        <div class="globe globe-1"></div>
        <div class="globe globe-2"></div>
    </div>

    <header class="main-header">
        <div class="logo-container" onclick="window.location.href='index.html'" style="cursor: pointer;">
            <i class="ph-fill ph-calendar-star logo-icon"></i>
            <h1>PoGo<span class="highlight">Hub</span></h1>
        </div>
        <nav>
            <button class="nav-btn" onclick="window.location.href='index.html'">Home</button>
            <div id="auth-section"></div>
        </nav>
    </header>

    <main class="container">
        <!-- Shown when something is missing: no database, not logged in, or not an admin -->
        <div id="admin-gate" class="auth-check-msg admin-gate">
            <h2 id="gate-title"><i class="ph-duotone ph-lock-key"></i> Admin</h2>
            <p id="gate-text">Loading…</p>
            <form id="admin-login" class="admin-login" hidden>
                <div class="search-box">
                    <i class="ph-bold ph-envelope"></i>
                    <input type="email" id="admin-email" placeholder="Email address" required>
                </div>
                <div class="search-box">
                    <i class="ph-bold ph-lock-key"></i>
                    <input type="password" id="admin-password" placeholder="Password" required>
                </div>
                <button type="submit" class="action-btn">Log in</button>
            </form>
        </div>

        <div id="admin-view" hidden>
            <section class="section-block">
                <div class="section-header admin-header">
                    <h3><i class="ph-fill ph-pencil-simple-line"></i> <span id="form-title">New event</span></h3>
                    <button type="button" class="nav-btn" id="new-event-btn"><i class="ph-bold ph-plus"></i> New event</button>
                </div>

                <form id="event-form" class="admin-form">
                    <label class="admin-field admin-wide">
                        <span>Name</span>
                        <input type="text" id="f-name" required placeholder="Pawniard Community Day">
                    </label>
                    <label class="admin-field">
                        <span>Type</span>
                        <select id="f-type" required></select>
                    </label>
                    <label class="admin-field">
                        <span>Picture (link, optional)</span>
                        <input type="url" id="f-image" placeholder="https://…">
                    </label>
                    <label class="admin-field">
                        <span>Starts</span>
                        <input type="datetime-local" id="f-start" required>
                    </label>
                    <label class="admin-field">
                        <span>Ends</span>
                        <input type="datetime-local" id="f-end" required>
                    </label>
                    <label class="admin-check admin-wide">
                        <input type="checkbox" id="f-global">
                        <span>Same moment worldwide (for example GO Battle League). Leave off for events that follow local time.</span>
                    </label>
                    <label class="admin-field">
                        <span>Pokémon (one per line, add * if it can be shiny)</span>
                        <textarea id="f-pokemon" rows="4" placeholder="Pawniard *"></textarea>
                    </label>
                    <label class="admin-field">
                        <span>Bonuses (one per line)</span>
                        <textarea id="f-bonuses" rows="4" placeholder="3× Stardust for catching Pokémon"></textarea>
                    </label>
                    <label class="admin-field">
                        <span>Codes (one per line)</span>
                        <textarea id="f-codes" rows="2"></textarea>
                    </label>
                    <label class="admin-field">
                        <span>Own description (optional, replaces the automatic one)</span>
                        <textarea id="f-description" rows="2"></textarea>
                    </label>
                    <p class="admin-preview admin-wide" id="f-preview"></p>
                    <div class="admin-actions admin-wide">
                        <button type="submit" class="action-btn" id="save-btn">Save event</button>
                        <button type="button" class="action-btn remove-btn" id="delete-btn" hidden>Delete event</button>
                    </div>
                </form>
            </section>

            <section class="section-block">
                <div class="section-header">
                    <h3><i class="ph-fill ph-list-bullets"></i> All events</h3>
                </div>
                <div class="list-layout" id="admin-list"></div>
            </section>
        </div>
    </main>

    <footer>
        <p>Built for Trainers, by Trainers.</p>
    </footer>

    <script src="script.js?v=6"></script>
    <script src="admin.js?v=6"></script>
</body>

</html>
