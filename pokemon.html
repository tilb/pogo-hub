<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon - PoGo Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=14">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <meta name="theme-color" content="#0f172a">
    <script src="settings.js?v=14"></script>
    <script src="config.js?v=14"></script>
</head>

<body>
    <div class="background-globes">
        <div class="globe globe-1"></div>
        <div class="globe globe-2"></div>
    </div>

    <header class="main-header">
        <div class="logo-container">
            <i class="ph-fill ph-calendar-star logo-icon"></i>
            <h1>PoGo<span class="highlight">Hub</span></h1>
        </div>
        <nav>
            <div id="auth-section"></div>
        </nav>
    </header>

    <main class="container">
        <section class="page-hero">
            <h2 data-i18n-html="page.pokemon.title">Pokémon</h2>
            <p class="subtitle" data-i18n="page.pokemon.subtitle"></p>
        </section>

        <section class="page-body">
            <div class="search-box mon-search">
                <i class="ph-bold ph-magnifying-glass"></i>
                <input type="search" id="pokemon-search" autocomplete="off" placeholder="Type a Pokémon" data-i18n-placeholder="page.pokemon.placeholder">
            </div>
            <p class="mon-count" id="pokemon-count"></p>
            <div id="pokemon-results"><div class="loading-state">…</div></div>
        </section>
    </main>

    <footer>
        <p data-i18n="footer">Built for Trainers, by Trainers.</p>
    </footer>

    <script src="script.js?v=14"></script>
    <script src="pages.js?v=14"></script>
</body>

</html>
