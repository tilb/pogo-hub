<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoGo Events Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body>
    <div class="background-globes">
        <div class="globe globe-1"></div>
        <div class="globe globe-2"></div>
    </div>

    <header class="main-header">
        <div class="logo-container">
            <i class="ph-fill ph-calendar-star logo-icon"></i>
            <h1>PoGo<span class="highlight">Hub</span></h1>
        </div>
        <nav>
            <!-- Future nav items -->
        </nav>
    </header>

    <main class="container">
        <!-- Hero Section -->
        <section class="hero">
            <h2>Don't miss the next <span class="text-gradient">Big Catch</span></h2>
            <p class="subtitle">Your ultimate tracker for Pokémon GO events.</p>
        </section>

        <!-- Current Events -->
        <section class="section-block" id="current-events">
            <div class="section-header">
                <h3><i class="ph-fill ph-broadcast"></i> Live Now</h3>
                <span class="live-indicator"></span>
            </div>
            <div class="cards-grid" id="active-events-container">
                <!-- Javascript will populate this -->
                <div class="loading-state">Loading active events...</div>
            </div>
        </section>

        <!-- Upcoming Events -->
        <section class="section-block" id="upcoming-events">
            <div class="section-header">
                <h3><i class="ph-fill ph-clock-countdown"></i> Coming Soon</h3>
            </div>
            <div class="list-layout" id="upcoming-events-container">
                <!-- Javascript will populate this -->
                <div class="loading-state">Loading upcoming events...</div>
            </div>
        </section>
    </main>

    <!-- Event Details Modal -->
    <div id="event-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <button class="close-modal" id="close-modal-btn"><i class="ph-bold ph-x"></i></button>
            <div class="modal-header">
                <span class="modal-type" id="modal-type">Event Type</span>
                <h2 class="modal-title" id="modal-title">Event Title</h2>
            </div>
            <div class="modal-body">
                <div class="modal-info-row">
                    <i class="ph-fill ph-calendar-blank"></i>
                    <span id="modal-date">Date Range</span>
                </div>
                <div class="modal-info-row">
                    <i class="ph-fill ph-clock"></i>
                    <span id="modal-time">Time</span>
                </div>
                <p class="modal-desc" id="modal-desc">Description goes here...</p>
                <div class="modal-extra" id="modal-extra">
                    <!-- Bonus features can go here -->
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>Built for Trainers by Trainers.</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
