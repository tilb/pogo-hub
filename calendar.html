<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Schedule - PoGo Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="config.js"></script>
    <style>
        .calendar-header {
            margin-top: 2rem;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .auth-check-msg {
            text-align: center;
            margin-top: 4rem;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
        }

        .saved-events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .remove-btn {
            background-color: rgba(255, 69, 58, 0.2);
            color: #ff453a;
            border: 1px solid rgba(255, 69, 58, 0.3);
            margin-top: 0.5rem;
            width: 100%;
        }

        .remove-btn:hover {
            background-color: rgba(255, 69, 58, 0.4);
        }
    </style>
</head>

<body>
    <div class="background-globes">
        <div class="globe globe-1"></div>
        <div class="globe globe-2"></div>
    </div>

    <header class="main-header">
        <div class="logo-container" onclick="window.location.href='index.html'" style="cursor: pointer;">
            <i class="ph-fill ph-calendar-star logo-icon"></i>
            <h1>PoGo<span class="highlight">Hub</span></h1>
        </div>
        <nav>
            <button class="nav-btn" onclick="window.location.href='index.html'">Home</button>
            <div id="auth-section">
                <!-- Javascript will populate this -->
            </div>
        </nav>
    </header>

    <main class="container">
        <div id="calendar-view" style="display: none;">
            <div class="calendar-header">
                <h2><i class="ph-fill ph-check-square-offset"></i> My <span class="text-gradient">Saved Events</span>
                </h2>
                <p class="subtitle" id="user-welcome">Welcome back!</p>
            </div>

            <div id="saved-events-container" class="saved-events-grid">
                <!-- Saved events go here -->
                <p>Loading your schedule...</p>
            </div>
        </div>

        <div id="login-required" class="auth-check-msg">
            <h2><i class="ph-duotone ph-lock-key"></i> Login Required</h2>
            <p>Please log in to view your personal calendar.</p>
            <button class="action-btn" onclick="window.location.href='index.html'"
                style="margin-top: 1rem; display: inline-block; width: auto; padding: 0.8rem 2rem;">Go to Login</button>
        </div>
    </main>

    <footer>
        <p>Built for Trainers, by Trainers.</p>
    </footer>

    <script src="script.js"></script>
    <script>
        // Inline script to init calendar view using Supabase auth
        document.addEventListener('DOMContentLoaded', async () => {
            window.checkAuthStatus(); // Update header (async, but fire-and-forget)

            const { data: { session } } = await window.supabaseClient.auth.getSession();

            if (session) {
                document.getElementById('calendar-view').style.display = 'block';
                document.getElementById('login-required').style.display = 'none';
                const displayName = session.user.email.split('@')[0];
                document.getElementById('user-welcome').textContent = `Welcome back, ${displayName}!`;
                window.renderSavedEvents();
            } else {
                document.getElementById('calendar-view').style.display = 'none';
                document.getElementById('login-required').style.display = 'block';
            }
        });
    </script>
</body>

</html>
